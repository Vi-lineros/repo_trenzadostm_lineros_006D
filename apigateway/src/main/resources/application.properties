spring.application.name=apigateway
server.port=9090

# 1. USUARIO
spring.cloud.gateway.routes[0].id=usuario-service
spring.cloud.gateway.routes[0].uri=http://localhost:8083
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/usuarios/**

# 2. DIRECCION, REGION, COMUNA, CIUDAD
spring.cloud.gateway.routes[1].id=direccion-service
spring.cloud.gateway.routes[1].uri=http://localhost:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/direccion/**,/api/v1/region/**,/api/v1/comuna/**,/api/v1/ciudad/**

# 3. INVENTARIO
spring.cloud.gateway.routes[2].id=inventario-service
spring.cloud.gateway.routes[2].uri=http://localhost:8084
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/inventario/**,/api/v1/productos/**,/api/v1/tipo-producto/**,/api/v1/categorias/**

# 4. PEDIDO
spring.cloud.gateway.routes[3].id=pedido-service
spring.cloud.gateway.routes[3].uri=http://localhost:8085
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/pedido/**,/api/v1/detallepedido/**

# 5. PAGO
spring.cloud.gateway.routes[4].id=pago-service
spring.cloud.gateway.routes[4].uri=http://localhost:8086
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/bancos/**,/api/v1/pagos/**